[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-skill-eval"
version = "0.1.0"
description = "Test harness for Claude Code skill packs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Surabhi Pradhan"}]
dependencies = [
    "anthropic>=0.40.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
skill-eval = "eval.runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eval*"]
