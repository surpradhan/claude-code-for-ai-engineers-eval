[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-skill-eval"
version = "0.1.0"
description = "Test harness for Claude Code skill packs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Surabhi Pradhan"}]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
]
# Note: no `anthropic` dependency. The judge shells out to the `claude` CLI
# so it uses your Claude Max plan instead of a separate API key.

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
skill-eval = "eval.runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eval*"]
